<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PUBG 迫击炮测距工具</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a2e;
  font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
  color: #eee;
  overflow: hidden;
  height: 100vh;
  user-select: none;
}

#toolbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 16px;
  background: #16213e;
  border-bottom: 2px solid #0f3460;
  flex-wrap: wrap;
}

#toolbar label { font-size: 14px; color: #a0b4c8; }

#mapSelect {
  background: #1a1a2e;
  color: #eee;
  border: 1px solid #0f3460;
  padding: 6px 12px;
  border-radius: 4px;
  font-size: 14px;
  cursor: pointer;
}

#distanceDisplay {
  font-size: 22px;
  font-weight: bold;
  color: #e94560;
  background: #1a1a2e;
  padding: 6px 16px;
  border-radius: 6px;
  border: 1px solid #e94560;
  min-width: 140px;
  text-align: center;
}

#distanceDisplay.ready { color: #00ff88; border-color: #00ff88; }

button {
  background: #0f3460;
  color: #eee;
  border: none;
  padding: 7px 16px;
  border-radius: 4px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.2s;
}
button:hover { background: #1a5a9a; }
button.danger { background: #6b2040; }
button.danger:hover { background: #8b3050; }

#coordInfo {
  font-size: 12px;
  color: #7a8fa0;
  margin-left: auto;
}

#container {
  position: relative;
  width: 100%;
  height: calc(100vh - 56px);
  cursor: crosshair;
  overflow: hidden;
  background: #0a0a1a;
}

canvas {
  position: absolute;
  top: 0; left: 0;
}

#hint {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: rgba(0,0,0,0.7);
  color: #a0b4c8;
  padding: 8px 20px;
  border-radius: 20px;
  font-size: 13px;
  pointer-events: none;
}

#legend {
  position: absolute;
  top: 12px;
  left: 12px;
  background: rgba(0,0,0,0.75);
  padding: 10px 14px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.8;
  pointer-events: none;
}
#legend .dot {
  display: inline-block;
  width: 10px; height: 10px;
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}
#legend .dot.me { background: #4cc9f0; }
#legend .dot.target { background: #e94560; }
#legend .dot.range { background: rgba(233,69,96,0.25); border: 1px solid rgba(233,69,96,0.5); }

#dropHint {
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: rgba(0,0,0,0.7);
  color: #a0b4c8;
  font-size: 18px;
  pointer-events: none;
  z-index: 10;
}
</style>
</head>
<body>

<div id="toolbar">
  <label>地图选择</label>
  <select id="mapSelect">
    <option value="taego" selected>Taego / 泰戈</option>
    <option value="erangel">Erangel / 艾伦格</option>
    <option value="miramar">Miramar / 米拉玛</option>
    <option value="deston">Deston / 帝斯顿</option>
    <option value="rondo">Rondo / 荣都</option>
    <option value="vikendi">Vikendi / 维寒迪</option>
    <option value="sanhok">Sanhok / 萨诺</option>
    <option value="paramo">Paramo / 帕拉莫</option>
    <option value="karakin">Karakin / 卡拉金</option>
  </select>

  <span id="distanceDisplay">点击地图放置标记</span>

  <button id="undoBtn" disabled>↩ 撤销</button>
  <button id="resetBtn">✕ 重置</button>
  <button id="zoomInBtn">＋ 放大</button>
  <button id="zoomOutBtn">－ 缩小</button>
  <button id="fitBtn">⊞ 适合窗口</button>
  <button id="gridToggle">▦ 网格</button>
  <button id="rangeToggle">◎ 射程环</button>
  <button id="loadImageBtn">📁 加载图片</button>
  <input type="file" id="fileInput" accept="image/*" style="display:none">

  <span id="coordInfo"></span>
</div>

<div id="container">
  <canvas id="mapCanvas"></canvas>
  <div id="hint">左键放置标记 | 滚轮缩放 | 右键拖拽 | 点击「📁 加载图片」或拖放图片文件导入地图</div>
  <div id="legend">
    <div><span class="dot me"></span> 己方位置（起点）</div>
    <div><span class="dot target"></span> 目标位置（终点）</div>
    <div><span class="dot range"></span> 迫击炮射程范围</div>
  </div>
</div>

<script>
// ========== 地图配置 ==========
const MAPS = {
  erangel:  { name: 'Erangel / 艾伦格',  size: 8000, grid: 8, image: null },
  miramar:  { name: 'Miramar / 米拉玛',  size: 8000, grid: 8, image: null },
  taego:    { name: 'Taego / 泰戈',      size: 8000, grid: 8, image: null },
  deston:   { name: 'Deston / 帝斯顿',   size: 8000, grid: 8, image: null },
  rondo:    { name: 'Rondo / 荣都',      size: 8000, grid: 8, image: null },
  vikendi:  { name: 'Vikendi / 维寒迪',  size: 6000, grid: 6, image: null },
  sanhok:   { name: 'Sanhok / 萨诺',     size: 4000, grid: 4, image: null },
  paramo:   { name: 'Paramo / 帕拉莫',   size: 3000, grid: 3, image: null },
  karakin:  { name: 'Karakin / 卡拉金',  size: 2000, grid: 2, image: null }
};

// 地图图片 URL — 使用 JSDelivr CDN (全球加速，比 GitHub raw 更快)
const MAP_IMAGE_URLS = {
  erangel: 'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Erangel_Main_High_Res.jpg',
  miramar: 'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Miramar_Main_High_Res.jpg',
  taego:   'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Taego_Main_High_Res.jpg',
  deston:  'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Deston_Main_High_Res.jpg',
  rondo:   'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Rondo_Main_High_Res.jpg',
  vikendi: 'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Vikendi_Main_High_Res.jpg',
  sanhok:  'https://cdn.jsdelivr.net/gh/ShiQi-zfh/pubg-map-tools@main/src/assets/img/maps/Sanhok_Main_High_Res.jpg',
  paramo:  null,
  karakin: null
};

// ========== 状态 ==========
let currentMap = 'taego';
let mapImage = null;
let imageLoaded = false;

let markers = [];        // [{x_pixel, y_pixel}] 最多2个

let offsetX = 0, offsetY = 0;   // 平移偏移 (屏幕像素)
let scale = 1;                   // 缩放比例
let imgNaturalW = 1, imgNaturalH = 1; // 图片原始尺寸

let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let dragStartOffX = 0, dragStartOffY = 0;

let showGrid = true;
let showRangeRing = true;
let mortarMaxRange = 400; // 迫击炮最大射程(米)

// 高DPI canvas
const PIXEL_RATIO = window.devicePixelRatio || 1;

// ========== DOM 元素 ==========
const canvas = document.getElementById('mapCanvas');
const ctx = canvas.getContext('2d');
const container = document.getElementById('container');
const distanceDisplay = document.getElementById('distanceDisplay');
const mapSelect = document.getElementById('mapSelect');
const hint = document.getElementById('hint');
const coordInfo = document.getElementById('coordInfo');
const undoBtn = document.getElementById('undoBtn');
const rangeToggle = document.getElementById('rangeToggle');

// ========== 初始化 ==========
function init() {
  resizeCanvas();
  loadMapImage(currentMap);
  updateDistanceDisplay();
  draw();
}

function resizeCanvas() {
  const rect = container.getBoundingClientRect();
  canvas.width = rect.width * PIXEL_RATIO;
  canvas.height = rect.height * PIXEL_RATIO;
  canvas.style.width = rect.width + 'px';
  canvas.style.height = rect.height + 'px';
  ctx.setTransform(PIXEL_RATIO, 0, 0, PIXEL_RATIO, 0, 0);
}

window.addEventListener('resize', () => {
  resizeCanvas();
  draw();
});

// 本地图片映射 — 如果同目录下有这些文件，优先加载本地图片
const LOCAL_MAP_FILES = {
  taego:   'taego_map.jpg',
  erangel: 'erangel_map.jpg',
  miramar: 'miramar_map.jpg',
  deston:  'deston_map.jpg',
  rondo:   'rondo_map.jpg',
  vikendi: 'vikendi_map.jpg',
  sanhok:  'sanhok_map.jpg',
  paramo:  'paramo_map.jpg',
  karakin: 'karakin_map.jpg'
};

// ========== 图片加载 ==========
function loadMapImage(mapId) {
  imageLoaded = false;

  // 构建 URL 尝试列表：本地 > CDN > 备用
  const urls = [];
  if (LOCAL_MAP_FILES[mapId]) urls.push(LOCAL_MAP_FILES[mapId]);
  if (MAP_IMAGE_URLS[mapId]) urls.push(MAP_IMAGE_URLS[mapId]);

  // 备用 GitHub raw URL（仅部分地图有）
  const legacyFallbacks = {
    erangel: 'https://raw.githubusercontent.com/lonelytb/PUBG-Map/master/Erangel.jpg',
    miramar: 'https://raw.githubusercontent.com/lonelytb/PUBG-Map/master/Miramar.jpg',
    sanhok:  'https://raw.githubusercontent.com/lonelytb/PUBG-Map/master/Savage%208K.jpg'
  };
  if (legacyFallbacks[mapId]) urls.push(legacyFallbacks[mapId]);

  // 更新提示文字
  hint.textContent = '正在加载地图图片...';

  // 依次尝试每个 URL
  let tryIndex = 0;
  function tryNext() {
    if (tryIndex >= urls.length) {
      // 全部失败，使用网格占位
      console.warn('All image URLs failed for ' + mapId);
      useGridFallback(mapId);
      return;
    }
    const url = urls[tryIndex];
    console.log('Trying map image (' + (tryIndex + 1) + '/' + urls.length + '): ' + url.substring(0, 60) + '...');

    mapImage = new Image();
    mapImage.onload = () => {
      console.log('Map image loaded: ' + mapImage.naturalWidth + 'x' + mapImage.naturalHeight);
      imageLoaded = true;
      imgNaturalW = mapImage.naturalWidth;
      imgNaturalH = mapImage.naturalHeight;
      fitToScreen();
      draw();
      hint.textContent = '地图已加载 | 左键放置标记 | 滚轮缩放 | 右键拖拽';
    };
    mapImage.onerror = () => {
      console.warn('Failed (' + (tryIndex + 1) + '/' + urls.length + '): ' + url.substring(0, 60) + '...');
      tryIndex++;
      tryNext();
    };
    mapImage.src = url;
  }

  tryNext();
}

function useGridFallback(mapId) {
  console.warn('All image sources failed for ' + mapId + '. Using grid-only mode.');
  imageLoaded = false;
  mapImage = null;
  imgNaturalW = MAPS[mapId].size;
  imgNaturalH = MAPS[mapId].size;
  fitToScreen();
  draw();
  hint.textContent = '⚠ 地图图片加载失败，显示网格模式 | 可点击「📁 加载图片」导入本地图片 | 左键放置标记';
}

function fitToScreen() {
  const rect = container.getBoundingClientRect();
  const availW = rect.width - 20;
  const availH = rect.height - 20;

  let baseW = imageLoaded ? imgNaturalW : MAPS[currentMap].size;
  let baseH = imageLoaded ? imgNaturalH : MAPS[currentMap].size;

  scale = Math.min(availW / baseW, availH / baseH);
  offsetX = (rect.width - baseW * scale) / 2;
  offsetY = (rect.height - baseH * scale) / 2;
}

// ========== 坐标转换 ==========
// 屏幕坐标 -> 地图逻辑像素坐标
function screenToMap(sx, sy) {
  return {
    x: (sx - offsetX) / scale,
    y: (sy - offsetY) / scale
  };
}

// 地图逻辑像素坐标 -> 屏幕坐标
function mapToScreen(mx, my) {
  return {
    x: mx * scale + offsetX,
    y: my * scale + offsetY
  };
}

// 地图逻辑像素距离 -> 实际米数
function pixelDistToMeters(pxDist) {
  const mapCfg = MAPS[currentMap];
  let refPixels = imageLoaded ? imgNaturalW : mapCfg.size;
  return (pxDist / refPixels) * mapCfg.size;
}

// 米数 -> 地图逻辑像素距离
function metersToPixelDist(meters) {
  const mapCfg = MAPS[currentMap];
  let refPixels = imageLoaded ? imgNaturalW : mapCfg.size;
  return (meters / mapCfg.size) * refPixels;
}

// ========== 绘制 ==========
function draw() {
  const w = canvas.width / PIXEL_RATIO;
  const h = canvas.height / PIXEL_RATIO;
  ctx.clearRect(0, 0, w, h);

  // 背景
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, w, h);

  // 计算地图绘制区域
  let mapW, mapH;
  if (imageLoaded) {
    mapW = imgNaturalW * scale;
    mapH = imgNaturalH * scale;
  } else {
    mapW = MAPS[currentMap].size * scale;
    mapH = MAPS[currentMap].size * scale;
  }

  // 绘制地图底图或占位图
  if (imageLoaded && mapImage) {
    ctx.drawImage(mapImage, offsetX, offsetY, mapW, mapH);
  } else {
    drawPlaceholderMap(w, h);
  }

  // 绘制网格
  if (showGrid) drawGrid();

  // 绘制迫击炮射程环
  if (showRangeRing && markers.length >= 1) drawRangeRings();

  // 绘制标记连线
  if (markers.length === 2) drawLineAndDistance();

  // 绘制标记点
  markers.forEach((m, i) => drawMarker(m, i));

  // 绘制边框
  ctx.strokeStyle = '#0f3460';
  ctx.lineWidth = 2;
  ctx.strokeRect(offsetX, offsetY, mapW, mapH);
}

function drawPlaceholderMap(w, h) {
  const mapCfg = MAPS[currentMap];
  const mapW = mapCfg.size * scale;
  const mapH = mapCfg.size * scale;

  // 地图底色
  ctx.fillStyle = '#1a2a1a';
  ctx.fillRect(offsetX, offsetY, mapW, mapH);

  // 绘制带颜色的区域模拟地形
  const colors = ['#1a2a1a', '#1a281a', '#1f2f1a', '#1a2a20', '#1f2a1f'];
  const gridCount = mapCfg.grid;
  for (let row = 0; row < gridCount; row++) {
    for (let col = 0; col < gridCount; col++) {
      ctx.fillStyle = colors[(row + col) % colors.length];
      ctx.fillRect(
        offsetX + (col / gridCount) * mapW,
        offsetY + (row / gridCount) * mapH,
        mapW / gridCount + 1,
        mapH / gridCount + 1
      );
    }
  }

  // 提示文字
  if (!imageLoaded) {
    ctx.fillStyle = '#a0b4c8';
    ctx.font = '16px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(
      '地图图片加载中或加载失败，显示网格占位图',
      offsetX + mapW / 2,
      offsetY + mapH / 2 - 10
    );
    ctx.fillText(
      '可拖放本地地图图片到此窗口使用',
      offsetX + mapW / 2,
      offsetY + mapH / 2 + 20
    );
  }
}

function drawGrid() {
  const mapCfg = MAPS[currentMap];
  const mapW = (imageLoaded ? imgNaturalW : mapCfg.size) * scale;
  const mapH = (imageLoaded ? imgNaturalH : mapCfg.size) * scale;
  const bigGridCount = mapCfg.grid; // 大格数量 (1000m格)
  const smallPerBig = 10;           // 每个大格10个小格 (100m)

  // 小格 (100m) - 淡色
  ctx.strokeStyle = 'rgba(255,255,255,0.08)';
  ctx.lineWidth = 0.5;
  const totalSmall = bigGridCount * smallPerBig;
  for (let i = 0; i <= totalSmall; i++) {
    const x = offsetX + (i / totalSmall) * mapW;
    const y = offsetY + (i / totalSmall) * mapH;
    ctx.beginPath();
    ctx.moveTo(x, offsetY);
    ctx.lineTo(x, offsetY + mapH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(offsetX, y);
    ctx.lineTo(offsetX + mapW, y);
    ctx.stroke();
  }

  // 大格 (1000m) - 较亮
  ctx.strokeStyle = 'rgba(255,255,255,0.25)';
  ctx.lineWidth = 1.5;
  for (let i = 0; i <= bigGridCount; i++) {
    const x = offsetX + (i / bigGridCount) * mapW;
    const y = offsetY + (i / bigGridCount) * mapH;
    ctx.beginPath();
    ctx.moveTo(x, offsetY);
    ctx.lineTo(x, offsetY + mapH);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(offsetX, y);
    ctx.lineTo(offsetX + mapW, y);
    ctx.stroke();
  }

  // 大格坐标标注
  ctx.fillStyle = 'rgba(255,255,255,0.5)';
  ctx.font = '11px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  for (let i = 0; i <= bigGridCount; i++) {
    for (let j = 0; j <= bigGridCount; j++) {
      const labelX = offsetX + (i / bigGridCount) * mapW;
      const labelY = offsetY + (j / bigGridCount) * mapH;
      ctx.fillText(
        `${String.fromCharCode(65 + i)}${j}`,
        labelX,
        labelY - 4
      );
    }
  }
}

function drawMarker(marker, index) {
  const screen = mapToScreen(marker.x, marker.y);

  // 外圈光晕
  ctx.beginPath();
  ctx.arc(screen.x, screen.y, 16, 0, Math.PI * 2);
  ctx.fillStyle = index === 0 ? 'rgba(76,201,240,0.2)' : 'rgba(233,69,96,0.2)';
  ctx.fill();

  // 内圈
  ctx.beginPath();
  ctx.arc(screen.x, screen.y, 8, 0, Math.PI * 2);
  ctx.fillStyle = index === 0 ? '#4cc9f0' : '#e94560';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 2;
  ctx.stroke();

  // 十字线
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(screen.x - 14, screen.y);
  ctx.lineTo(screen.x + 14, screen.y);
  ctx.moveTo(screen.x, screen.y - 14);
  ctx.lineTo(screen.x, screen.y + 14);
  ctx.stroke();

  // 标签
  const label = index === 0 ? '起点' : '目标';
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 13px "Microsoft YaHei", sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText(label, screen.x, screen.y - 22);
}

function drawLineAndDistance() {
  const p1 = mapToScreen(markers[0].x, markers[0].y);
  const p2 = mapToScreen(markers[1].x, markers[1].y);

  // 虚线连接
  ctx.setLineDash([6, 4]);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 2;
  ctx.beginPath();
  ctx.moveTo(p1.x, p1.y);
  ctx.lineTo(p2.x, p2.y);
  ctx.stroke();
  ctx.setLineDash([]);

  // 距离标注背景
  const midX = (p1.x + p2.x) / 2;
  const midY = (p1.y + p2.y) / 2;
  const pxDist = Math.sqrt(
    Math.pow(markers[1].x - markers[0].x, 2) +
    Math.pow(markers[1].y - markers[0].y, 2)
  );
  const meters = pixelDistToMeters(pxDist);

  const text = `${meters.toFixed(0)} m`;
  ctx.font = 'bold 15px "Microsoft YaHei", sans-serif';
  const textW = ctx.measureText(text).width;
  const padX = 8, padY = 4;

  ctx.fillStyle = 'rgba(0,0,0,0.8)';
  ctx.fillRect(midX - textW / 2 - padX, midY - 8 - padY, textW + padX * 2, 18 + padY * 2);
  ctx.strokeStyle = '#ffd700';
  ctx.lineWidth = 1.5;
  ctx.strokeRect(midX - textW / 2 - padX, midY - 8 - padY, textW + padX * 2, 18 + padY * 2);

  ctx.fillStyle = '#ffd700';
  ctx.textAlign = 'center';
  ctx.fillText(text, midX, midY + 6);
}

function drawRangeRings() {
  const m = markers[0];
  const screen = mapToScreen(m.x, m.y);

  // 迫击炮最小射程 (~100m) 和最大射程 (~400m)
  const ranges = [100, 200, 300, 400];
  ranges.forEach((rng, idx) => {
    const pxRadius = metersToPixelDist(rng) * scale;
    ctx.beginPath();
    ctx.arc(screen.x, screen.y, pxRadius, 0, Math.PI * 2);
    const alpha = rng === 400 ? 0.4 : 0.2;
    ctx.strokeStyle = `rgba(233,69,96,${alpha})`;
    ctx.lineWidth = rng === 400 ? 2 : 1;
    ctx.setLineDash(rng === 400 ? [] : [3, 5]);
    ctx.stroke();
    ctx.setLineDash([]);

    // 距离标签
    ctx.fillStyle = `rgba(233,69,96,0.7)`;
    ctx.font = '11px "Microsoft YaHei", sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`${rng}m`, screen.x + 4, screen.y - pxRadius + 4);
  });
}

// ========== 事件处理 ==========
canvas.addEventListener('mousedown', (e) => {
  const rect = canvas.getBoundingClientRect();
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;

  // 右键拖拽平移
  if (e.button === 2) {
    isDragging = true;
    dragStartX = e.clientX;
    dragStartY = e.clientY;
    dragStartOffX = offsetX;
    dragStartOffY = offsetY;
    return;
  }

  // 左键放置标记
  if (e.button === 0) {
    const mapPos = screenToMap(sx, sy);

    // 检查是否在地图范围内
    const mapW = imageLoaded ? imgNaturalW : MAPS[currentMap].size;
    const mapH = imageLoaded ? imgNaturalH : MAPS[currentMap].size;
    if (mapPos.x < 0 || mapPos.x > mapW || mapPos.y < 0 || mapPos.y > mapH) return;

    if (markers.length >= 2) {
      // 已有两个标记，清除后重新放置
      markers = [];
    }
    markers.push({ x: mapPos.x, y: mapPos.y });
    updateDistanceDisplay();
    updateUndoBtn();
    draw();
  }
});

canvas.addEventListener('mousemove', (e) => {
  const rect = canvas.getBoundingClientRect();

  if (isDragging) {
    offsetX = dragStartOffX + (e.clientX - dragStartX);
    offsetY = dragStartOffY + (e.clientY - dragStartY);
    draw();
    return;
  }

  // 显示坐标
  const sx = e.clientX - rect.left;
  const sy = e.clientY - rect.top;
  const mapPos = screenToMap(sx, sy);
  const mapCfg = MAPS[currentMap];
  const refPixels = imageLoaded ? imgNaturalW : mapCfg.size;
  const coordX = ((mapPos.x / refPixels) * mapCfg.size).toFixed(0);
  const coordY = ((mapPos.y / refPixels) * mapCfg.size).toFixed(0);

  if (markers.length === 1) {
    const pxDist = Math.sqrt(
      Math.pow(mapPos.x - markers[0].x, 2) +
      Math.pow(mapPos.y - markers[0].y, 2)
    );
    const meters = pixelDistToMeters(pxDist);
    coordInfo.textContent = `坐标 (${coordX}, ${coordY}) | 距起点: ${meters.toFixed(0)}m`;
  } else {
    coordInfo.textContent = `坐标 (${coordX}, ${coordY})`;
  }
});

canvas.addEventListener('mouseup', () => {
  isDragging = false;
});

canvas.addEventListener('mouseleave', () => {
  isDragging = false;
});

canvas.addEventListener('contextmenu', (e) => e.preventDefault());

canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const mx = e.clientX - rect.left;
  const my = e.clientY - rect.top;

  const zoomFactor = e.deltaY < 0 ? 1.1 : 0.9;
  const newScale = scale * zoomFactor;

  // 限制缩放范围
  if (newScale < 0.1 || newScale > 10) return;

  // 以鼠标位置为中心缩放
  const mapX = (mx - offsetX) / scale;
  const mapY = (my - offsetY) / scale;
  offsetX = mx - mapX * newScale;
  offsetY = my - mapY * newScale;
  scale = newScale;

  draw();
});

// 触摸支持
let lastTouchDist = 0;
canvas.addEventListener('touchstart', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    lastTouchDist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
  }
}, { passive: false });

canvas.addEventListener('touchmove', (e) => {
  if (e.touches.length === 2) {
    e.preventDefault();
    const dist = Math.hypot(
      e.touches[0].clientX - e.touches[1].clientX,
      e.touches[0].clientY - e.touches[1].clientY
    );
    const factor = dist / lastTouchDist;
    const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    const rect = canvas.getBoundingClientRect();
    const mx = cx - rect.left;
    const my = cy - rect.top;

    const newScale = scale * factor;
    if (newScale >= 0.1 && newScale <= 10) {
      const mapX = (mx - offsetX) / scale;
      const mapY = (my - offsetY) / scale;
      offsetX = mx - mapX * newScale;
      offsetY = my - mapY * newScale;
      scale = newScale;
    }
    lastTouchDist = dist;
    draw();
  }
}, { passive: false });

// 加载本地图片的通用函数
function loadLocalImage(file) {
  if (!file || !file.type.startsWith('image/')) return false;

  const reader = new FileReader();
  reader.onload = (ev) => {
    mapImage = new Image();
    mapImage.onload = () => {
      imageLoaded = true;
      imgNaturalW = mapImage.naturalWidth;
      imgNaturalH = mapImage.naturalHeight;
      markers = [];
      updateDistanceDisplay();
      updateUndoBtn();
      fitToScreen();
      draw();
      hint.textContent = '✅ 自定义地图已加载 | 左键放置标记 | 滚轮缩放 | 右键拖拽';
    };
    mapImage.src = ev.target.result;
  };
  reader.readAsDataURL(file);
  return true;
}

// 拖放本地地图图片
container.addEventListener('dragover', (e) => {
  e.preventDefault();
  e.stopPropagation();
  container.style.outline = '3px dashed #4cc9f0';
  container.style.outlineOffset = '-6px';
});

container.addEventListener('dragleave', () => {
  container.style.outline = '';
});

container.addEventListener('drop', (e) => {
  e.preventDefault();
  e.stopPropagation();
  container.style.outline = '';
  loadLocalImage(e.dataTransfer.files[0]);
});

// ========== 点击按钮加载图片 ==========
document.getElementById('loadImageBtn').addEventListener('click', () => {
  document.getElementById('fileInput').click();
});

document.getElementById('fileInput').addEventListener('change', (e) => {
  if (e.target.files[0]) {
    loadLocalImage(e.target.files[0]);
    e.target.value = ''; // 允许重复选择同一文件
  }
});

// ========== UI 交互 ==========
mapSelect.addEventListener('change', () => {
  currentMap = mapSelect.value;
  markers = [];
  updateDistanceDisplay();
  updateUndoBtn();
  loadMapImage(currentMap);
});

document.getElementById('undoBtn').addEventListener('click', () => {
  markers.pop();
  updateDistanceDisplay();
  updateUndoBtn();
  draw();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  markers = [];
  updateDistanceDisplay();
  updateUndoBtn();
  fitToScreen();
  draw();
});

document.getElementById('zoomInBtn').addEventListener('click', () => {
  scale = Math.min(10, scale * 1.25);
  draw();
});

document.getElementById('zoomOutBtn').addEventListener('click', () => {
  scale = Math.max(0.1, scale * 0.8);
  draw();
});

document.getElementById('fitBtn').addEventListener('click', () => {
  fitToScreen();
  draw();
});

document.getElementById('gridToggle').addEventListener('click', function() {
  showGrid = !showGrid;
  this.style.background = showGrid ? '#1a5a9a' : '#0f3460';
  draw();
});

rangeToggle.addEventListener('click', function() {
  showRangeRing = !showRangeRing;
  this.style.background = showRangeRing ? '#1a5a9a' : '#0f3460';
  draw();
});

// 键盘快捷键
document.addEventListener('keydown', (e) => {
  switch (e.key.toLowerCase()) {
    case 'r': markers = []; updateDistanceDisplay(); updateUndoBtn(); draw(); break;
    case 'z': case 'u':
      if (e.ctrlKey || e.metaKey) {
        markers.pop();
        updateDistanceDisplay();
        updateUndoBtn();
        draw();
      }
      break;
    case 'g': showGrid = !showGrid; draw(); break;
    case 'f': fitToScreen(); draw(); break;
    case '+': case '=': scale = Math.min(10, scale * 1.25); draw(); break;
    case '-': scale = Math.max(0.1, scale * 0.8); draw(); break;
    case '0': scale = 1; offsetX = 0; offsetY = 0; draw(); break;
  }
});

function updateDistanceDisplay() {
  if (markers.length === 2) {
    const pxDist = Math.sqrt(
      Math.pow(markers[1].x - markers[0].x, 2) +
      Math.pow(markers[1].y - markers[0].y, 2)
    );
    const meters = pixelDistToMeters(pxDist);
    distanceDisplay.textContent = `${meters.toFixed(0)} m`;
    distanceDisplay.className = 'ready';

    // 迫击炮射程评估
    if (meters < 100) {
      distanceDisplay.textContent += ' (太近!)';
    } else if (meters > 400) {
      distanceDisplay.textContent += ' (超出射程)';
    }
  } else if (markers.length === 1) {
    distanceDisplay.textContent = '请放置目标点';
    distanceDisplay.className = '';
  } else {
    distanceDisplay.textContent = '点击地图放置起点';
    distanceDisplay.className = '';
  }
}

function updateUndoBtn() {
  undoBtn.disabled = markers.length === 0;
}

// ========== 启动 ==========
init();

console.log('  F键 - 适应窗口');
